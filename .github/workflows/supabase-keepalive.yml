# Free Supabase projects pause after seven days without a request. One cheap
# authenticated read per day resets that timer.
#
# Requires two repository secrets:
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon public key
#
# Both are client-side values, not credentials: every row they can reach is
# gated by row level security, and the payloads behind that gate are encrypted
# with a key this repository never holds.

name: Keep sync service awake

on:
  schedule:
    # 09:14 UTC daily. An odd minute avoids the top-of-hour scheduling crowd,
    # which is when GitHub is most likely to delay a run.
    - cron: "14 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Secrets are not configured; nothing to ping."
            exit 0
          fi
          # An unauthenticated read of a policied table. Row level security
          # returns an empty set rather than data, which is all that is wanted:
          # the request itself is what resets the inactivity timer.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/records?select=kind&limit=1")
          echo "PostgREST responded ${status}"
          # 2xx and 401/403 all prove the project is awake and serving.
          case "${status}" in
            2*|401|403) exit 0 ;;
            *) echo "Unexpected status ${status}"; exit 1 ;;
          esac
